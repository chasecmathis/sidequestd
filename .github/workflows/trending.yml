name: Trending recompute

# Keeps the trending ranking (SPEC §6.5, §6.11) current by re-running
# `app.cli.trending` on a schedule. `trending_scores` is materialised and has no
# fallback: `GET /games/trending`, Discover's trending shelf, `/feed/suggestions`
# and the cold-start branch of the recommender all read that table and nothing
# else, so without this job they are permanently empty.
#
# Same shape as catalog-sync.yml, and for the same reason: the runner has no
# route to the Fly private network, so DATABASE_URL is unreachable from GitHub.
# This job only launches a throwaway Fly machine from the API's own image, waits
# for it, and reports what it did. DATABASE_URL comes from the app's secrets,
# which Fly injects into any machine in the app.

on:
  schedule:
    # Daily at 06:00 UTC. Unlike the catalog sync there is no cost argument for
    # going weekly — this is three aggregate queries against our own database and
    # finishes in seconds, so the cadence is set by how stale the ranking is
    # allowed to look. An hour ahead of the Sunday catalog sync so the two do not
    # contend for the same machine capacity.
    - cron: "0 6 * * *"
  workflow_dispatch:

# A run rewrites each window wholesale, so two at once would have them clobbering
# each other's DELETE/INSERT. Queue rather than cancel — a run takes seconds, so
# waiting for one costs nothing.
concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  recompute:
    name: Recompute trending scores
    runs-on: ubuntu-latest
    # A backstop against a hung flyctl, not a bound on the work: the poll loop
    # below gives up at 10 minutes.
    timeout-minutes: 15

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: sidequestd-api
      # Fixed rather than run-scoped so a machine orphaned by a cancelled run is
      # findable and gets cleaned up by the next one.
      MACHINE_NAME: trending

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check the deploy credential is present
        run: |
          : "${FLY_API_TOKEN:?set the FLY_API_TOKEN repository secret}"

      # `fly machine run --name` fails outright if the name is taken, so a
      # machine left behind by a cancelled run would block every future run.
      - name: Remove a machine left behind by an earlier run
        run: |
          id=$(flyctl machines list --app "$FLY_APP" --json \
               | jq -r --arg n "$MACHINE_NAME" '.[] | select(.name==$n) | .id')
          if [ -n "$id" ]; then
            echo "destroying orphaned machine $id"
            flyctl machine destroy "$id" --app "$FLY_APP" --force
          else
            echo "no orphaned machine"
          fi

      - name: Launch the recompute
        run: |
          # Whatever image the app is running right now, rather than a pinned
          # digest: a scheduled machine created once would keep running the build
          # it was created from long after the app had moved on.
          img=$(flyctl image show --app "$FLY_APP" --json \
                | jq -r '.[0] | "\(.Registry)/\(.Repository):\(.Tag)"')
          echo "image: $img"

          # --detach because the attached form is not a job runner: it monitors
          # machine *start*, not command exit, and it hangs on a command that
          # finishes quickly — which this one does. The exit code is read back
          # from the machine's events instead, in the step below.
          #
          # --env RUN_MIGRATIONS=false because `fly machine run` injects the
          # app's secrets but NOT its fly.toml [env]. Without it the entrypoint
          # defaults RUN_MIGRATIONS to true and this job would run
          # `alembic upgrade head` against production as a side effect of a
          # trending recompute. ENVIRONMENT is likewise unset and so defaults to
          # `local`, which is what we want: the command touches only the
          # database, and the production guardrail would otherwise refuse to boot
          # over CORS and S3 settings this job never reads.
          #
          # The bare `--` matters. flyctl parses flags it recognises out of the
          # trailing command, and `-c` in particular is its own --config.
          #
          # --all-windows because the API advertises 24h, 7d and 30d; scoring
          # only the default would leave two of the three returning [] forever.
          flyctl machine run "$img" \
            --app "$FLY_APP" \
            --name "$MACHINE_NAME" \
            --region iad \
            --env RUN_MIGRATIONS=false \
            --vm-memory 1024 \
            --restart no \
            --detach \
            -- python -m app.cli.trending --all-windows

      - name: Wait for it to finish
        id: wait
        run: |
          # 10 minutes. The work is three aggregate queries per window and the
          # observed run is seconds, so most of this is machine start; hitting
          # the deadline means something is wrong rather than merely slow.
          deadline=$((SECONDS + 600))
          state=""
          missing=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            state=$(flyctl machines list --app "$FLY_APP" --json \
                    | jq -r --arg n "$MACHINE_NAME" '.[] | select(.name==$n) | .state')
            case "$state" in
              stopped|destroyed)
                echo "machine reached state: $state"
                break
                ;;
              "")
                # The list is eventually consistent and flyctl occasionally
                # returns a transient empty result, so one miss is not proof the
                # machine is gone. Three in a row (30s) is.
                missing=$((missing + 1))
                if [ "$missing" -ge 3 ]; then
                  echo "::error::the recompute machine disappeared before it finished"
                  exit 1
                fi
                echo "machine not listed (miss $missing/3)"
                sleep 10
                continue
                ;;
            esac
            missing=0
            echo "state=$state; still going ($((SECONDS))s elapsed)"
            sleep 10
          done

          if [ "$state" != "stopped" ] && [ "$state" != "destroyed" ]; then
            echo "::error::recompute did not finish within 10 minutes (last state: $state)"
            exit 1
          fi

      # Before the exit code, so a failure has its output right above it. The
      # command prints one `trending[window]: scored N game(s)` line per window,
      # so this is also the record of what the run actually produced.
      - name: Logs
        if: always()
        run: |
          id=$(flyctl machines list --app "$FLY_APP" --json \
               | jq -r --arg n "$MACHINE_NAME" '.[] | select(.name==$n) | .id')
          if [ -n "$id" ]; then
            flyctl logs --app "$FLY_APP" --machine "$id" --no-tail || true
          else
            echo "no machine to read logs from"
          fi

      - name: Report the result
        run: |
          # Fly's JSON omits exit_code entirely when it is 0, so an exit event
          # *without* the field means the command succeeded — it is not an
          # unreadable result. Only the absence of the whole exit event is
          # genuinely unknown.
          read_exit() {
            flyctl machines list --app "$FLY_APP" --json \
              | jq -r --arg n "$MACHINE_NAME" '
                  .[] | select(.name==$n) | .events
                  | (map(select(.type=="exit")) | first | .request.exit_event) as $e
                  | if $e == null then "unknown"
                    else "\($e.exit_code // 0) \($e.oom_killed // false)" end'
          }

          # The exit event can lag the state change that ended the wait loop, so
          # give it a minute before calling it unreadable.
          result="unknown"
          for _ in 1 2 3 4 5 6; do
            result=$(read_exit)
            [ "$result" != "unknown" ] && break
            echo "exit event not recorded yet; retrying"
            sleep 10
          done

          if [ "$result" = "unknown" ]; then
            # Never pass on a result we could not read: a silent daily failure is
            # the whole thing this step exists to prevent.
            echo "::error::could not read the recompute's exit event"
            exit 1
          fi

          code=${result%% *}
          oom=${result##* }
          echo "exit_code=$code oom_killed=$oom"

          if [ "$oom" = "true" ]; then
            echo "::error::the recompute was OOM-killed; raise --vm-memory"
            exit 1
          fi

          if [ "$code" = "0" ]; then
            echo "trending recompute completed"
          else
            echo "::error::trending recompute failed (exit $code); see the logs above. The run is idempotent — re-run it once the cause is fixed."
            exit 1
          fi

      # always(), so a failed or cancelled run does not leave a machine behind
      # (and does not leave it billing). The cleanup step at the top is the
      # backstop for the case where even this does not get to run.
      - name: Clean up
        if: always()
        run: |
          id=$(flyctl machines list --app "$FLY_APP" --json \
               | jq -r --arg n "$MACHINE_NAME" '.[] | select(.name==$n) | .id')
          if [ -n "$id" ]; then
            flyctl machine destroy "$id" --app "$FLY_APP" --force
          fi
