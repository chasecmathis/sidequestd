[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# The URL is supplied at runtime from app.core.config (see migrations/env.py) so
# there is never a credential in version control.
sqlalchemy.url =

file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
# `exec` rather than `console_scripts`: ruff ships a native binary and declares
# no console_scripts entrypoint for Alembic to resolve.
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
