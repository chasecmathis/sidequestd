# Production-shaped stack: the two images as they are actually built and run.
#
# This is a single-box deploy and a way to rehearse one locally. It is *not*
# infra/docker-compose.yml, which runs the dependencies (Postgres, MinIO,
# Mailpit) for `npm run api:dev` and has development credentials written into it.
# Nothing here has a default; every value comes from an env file you create.
#
#     docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --build
#
# One file feeds both halves of that: --env-file supplies the ${...} below, and
# `env_file` on the api service hands the same file to the container. DEPLOY.md
# has a template for it, and explains what each variable is and where to get it.

name: sidequestd-prod

services:
  # Managed Postgres (RDS, Cloud SQL, Neon) is the better default: backups,
  # point-in-time restore and failover are not worth rebuilding here. Drop this
  # service and point DATABASE_URL at the managed instance when you have one.
  #
  # Note the migration runs `CREATE EXTENSION IF NOT EXISTS pg_trgm`, so the
  # migrating role needs CREATE on the database — see DEPLOY.md.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the API needs to reach it.
    expose:
      - "5432"

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    # Read wholesale so a new setting does not need a change here as well. The
    # image's own entrypoint runs `alembic upgrade head` before binding.
    env_file:
      - ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the client bundle at build time, which is why it is a
        # build arg and not an environment variable. Changing it needs --build.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
