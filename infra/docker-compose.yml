name: sidequestd

services:
  postgres:
    image: postgres:17-alpine
    container_name: sidequestd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sidequestd
      POSTGRES_PASSWORD: sidequestd
      POSTGRES_DB: sidequestd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidequestd -d sidequestd"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. Not used by the auth slice, but the bucket is
  # provisioned now so review media (SPEC §6.3) has somewhere to land later.
  minio:
    image: minio/minio:latest
    container_name: sidequestd-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sidequestd
      MINIO_ROOT_PASSWORD: sidequestd-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: sidequestd-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sidequestd sidequestd-secret &&
      mc mb --ignore-existing local/sidequestd-media &&
      mc anonymous set download local/sidequestd-media &&
      echo 'MinIO bucket ready'
      "

  # Catches all outbound SMTP so password-reset links are readable in a browser
  # at http://localhost:8025 instead of being sent to a real inbox.
  mailpit:
    image: axllent/mailpit:latest
    container_name: sidequestd-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
